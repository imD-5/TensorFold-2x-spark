# Scan pull requests and pushes to the default engine branch. The workflow and scanner policy come from
# the trusted default branch. The pull request checkout is scan data only: no step runs code from it.
# Keep the binary and its config outside the checkout. Keep the job name (secrets) stable for branch rules.
name: secret-scan

on:
  # The token is read-only. No step runs pull request code or loads its scanner policy.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    branches: [deepseek-v41-tp2]
    types: [opened, synchronize, reopened]
  push:
    branches: [deepseek-v41-tp2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum -c -
          tar -xzf "$f" gitleaks
          printf '[extend]\nuseDefault = true\n' > gitleaks.toml
          mkdir -p no-ignore
      # Read the exact pull request head, or pushed commit, as scan data.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
          path: scan
          # Checkout v7 needs this for fork heads. The checkout is data only, and no write token is granted.
          allow-unsafe-pr-checkout: true
      # gitleaks also loads <source>/.gitleaksignore whatever --gitleaks-ignore-path says, so a commit could
      # hide its own leak with one. The job refuses such a file.
      - name: Refuse a .gitleaksignore in the checkout
        run: |
          if [ -e scan/.gitleaksignore ] || [ -L scan/.gitleaksignore ]; then
            echo "::error file=.gitleaksignore::remove .gitleaksignore: the secret scan does not accept repo ignores"
            exit 1
          fi
      # A .gitattributes in a commit could mark files -diff (binary). Then "git log -p" shows no content and
      # gitleaks finds nothing. .git/info/attributes has precedence over the files in the tree, and "* diff" sets a
      # text diff for each file.
      - name: Ignore the .gitattributes of the checkout
        run: |
          git -C scan config core.attributesFile /dev/null
          mkdir -p scan/.git/info
          echo '* diff' > scan/.git/info/attributes
      # --log-opts: the commits of this branch only (the default is every branch). --diff-merges=first-parent: git log
      # shows no patch for a merge commit by default, so a secret added in a merge resolution was not scanned.
      # --ignore-gitleaks-allow: a "gitleaks:allow" comment in a commit must not hide a finding.
      - name: gitleaks (all commits of this branch)
        run: >-
          "$RUNNER_TEMP/gitleaks" git scan --log-opts="--diff-merges=first-parent HEAD" --config "$RUNNER_TEMP/gitleaks.toml" --ignore-gitleaks-allow
          --gitleaks-ignore-path "$RUNNER_TEMP/no-ignore" --redact --no-banner --exit-code 1
